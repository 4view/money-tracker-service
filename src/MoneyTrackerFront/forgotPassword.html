<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Восстановление пароля — MoneyTracker</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/auth.css">
</head>

<body>
    <div class="auth-wrapper">
        <div class="auth-card">
            <div class="auth-logo">💰</div>
            <h1 class="auth-title">MoneyTracker</h1>

            <!-- Форма -->
            <div id="state-form">
                <h2 class="auth-heading">Забыли пароль?</h2>
                <p class="auth-subtitle">Введите email — мы пришлём ссылку для сброса пароля.</p>

                <div class="auth-form">
                    <div class="form-group">
                        <label class="form-label" for="email">Email</label>
                        <input type="email" id="email" class="form-input" placeholder="you@example.com"
                            autocomplete="email">
                    </div>
                    <div id="form-error" class="auth-error hidden"></div>
                    <button class="auth-btn" id="submit-btn">Отправить письмо</button>
                </div>

                <a href="login.html" class="auth-link">Вернуться к входу</a>
            </div>

            <!-- Успех -->
            <div id="state-success" class="hidden">
                <div class="auth-icon success">✉</div>
                <h2 class="auth-heading">Письмо отправлено</h2>
                <p class="auth-subtitle">
                    Если такой email зарегистрирован — мы отправили инструкции по сбросу пароля.
                    Проверьте папку «Спам», если письмо не пришло.
                </p>
                <a href="login.html" class="auth-btn">Вернуться к входу</a>
            </div>
        </div>
    </div>

    <script src="js/theme.js"></script>
    <script>
        const API_BASE_URL = 'http://localhost:5183/api';

        const submitBtn = document.getElementById('submit-btn');
        const emailInput = document.getElementById('email');
        const errorDiv = document.getElementById('form-error');

        function showError(msg) {
            errorDiv.textContent = msg;
            errorDiv.classList.remove('hidden');
        }

        function hideError() {
            errorDiv.classList.add('hidden');
        }

        submitBtn.addEventListener('click', async () => {
            const email = emailInput.value.trim();
            hideError();

            if (!email) {
                showError('Введите email');
                return;
            }

            submitBtn.disabled = true;
            submitBtn.textContent = '...';

            try {
                const response = await fetch(`${API_BASE_URL}/auth/forgot-password`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email }),
                });

                // Всегда показываем успех — не раскрываем существует ли email
                document.getElementById('state-form').classList.add('hidden');
                document.getElementById('state-success').classList.remove('hidden');
            } catch {
                showError('Ошибка соединения с сервером');
                submitBtn.disabled = false;
                submitBtn.textContent = 'Отправить письмо';
            }
        });

        emailInput.addEventListener('keypress', e => {
            if (e.key === 'Enter') submitBtn.click();
        });
    </script>
</body>

</html>
