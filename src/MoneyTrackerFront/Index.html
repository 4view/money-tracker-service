<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Сканер QR-кодов чеков</title>

    <!-- Библиотека для сканирования QR-кодов -->
    <script src="lib/html5-qrcode.min.js"></script>

    <!-- Подключение CSS -->
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <div class="container">
        <div class="header">
            <div class="header-content">
                <div class="nav-links">
                    <a href="expenses.html" class="nav-link">Все траты</a>
                    <a href="categories.html" class="nav-link">Категории</a>
                    <a href="Limits.html" class="nav-link">Лимиты</a>
                </div>
                <div class="user-info" id="user-info">
                    <button class="theme-toggle" id="theme-toggle">🌙</button>
                    <a href="profile.html" class="user-name" id="user-name" style="text-decoration:none;color:var(--text-primary);"></a>
                    <button class="logout-btn" id="logout-btn">Выйти</button>
                </div>
            </div>
            <p class="header-subtitle">Отсканируйте QR-код с чека</p>
        </div>

        <!-- Компактная информация о камере -->
        <div class="camera-info" id="camera-info">
            <span id="camera-status-text">✅ Камера доступна</span>
        </div>

        <!-- Кнопки действий -->
        <div class="action-btns-row">
            <button class="scan-btn" id="start-scan">
                Сканировать чек
            </button>
            <button class="manual-btn" id="add-manual-btn">
                + Добавить трату
            </button>
        </div>

        <!-- Контейнер сканера (изначально скрыт) -->
        <div class="scanner-wrapper hidden" id="scanner-wrapper">
            <div class="scanner-header">
                <span class="scanner-title">Наведите на QR-код</span>
                <button class="close-scanner" id="close-scanner">✕</button>
            </div>
            <div id="qr-reader"></div>
            <div id="camera-status" class="scanner-status"></div>
            <button class="secondary-btn stop-scan-btn" id="stop-scan">Остановить сканирование</button>
        </div>

        <!-- Результат сканирования -->
        <div class="result-container hidden" id="result-container">
            <div class="result-header">
                <h2>Результат сканирования</h2>
                <div style="display:flex;align-items:center;gap:8px;">
                    <span class="status" id="scan-status">Ожидание</span>
                    <button class="close-result-btn" id="close-result-btn" title="Закрыть">✕</button>
                </div>
            </div>

            <div class="expense-details" id="expense-details">
                <!-- Данные будут заполняться динамически -->
            </div>

            <div class="action-buttons">
                <button class="primary-btn" id="save-expense">Сохранить расход</button>
                <button class="secondary-btn" id="scan-new">Новый скан</button>
            </div>
        </div>

        <!-- Дашборд статистики -->
        <div class="dashboard" id="dashboard">
            <!-- Сводка за текущий месяц -->
            <div class="dash-summary" id="dash-summary">
                <div class="dash-summary-card">
                    <span class="dash-summary-label">Потрачено в этом месяце</span>
                    <span class="dash-summary-value" id="dash-total">...</span>
                </div>
                <div class="dash-summary-card">
                    <span class="dash-summary-label">Трат за месяц</span>
                    <span class="dash-summary-value" id="dash-count">...</span>
                </div>
                <div class="dash-summary-card">
                    <span class="dash-summary-label">Средняя трата</span>
                    <span class="dash-summary-value" id="dash-avg">...</span>
                </div>
            </div>

            <!-- График по дням -->
            <div class="dash-card">
                <div class="dash-card-header">
                    <span class="dash-card-title">Траты по дням</span>
                    <span class="dash-card-subtitle" id="dash-chart-period"></span>
                </div>
                <div class="dash-chart-wrap">
                    <svg id="dash-chart" class="dash-chart" viewBox="0 0 300 80" preserveAspectRatio="none"></svg>
                    <div class="dash-chart-labels" id="dash-chart-labels"></div>
                </div>
            </div>

            <!-- Топ категорий -->
            <div class="dash-card">
                <div class="dash-card-header">
                    <span class="dash-card-title">Топ категорий</span>
                </div>
                <div id="dash-categories"></div>
            </div>
        </div>

        <!-- Последние сканирования -->
        <div class="last-scans">
            <h3>Последние сканирования</h3>
            <div id="scans-list">
                <!-- Список последних сканирований -->
            </div>
        </div>
    </div>

    <!-- Модальное окно для редактирования -->
    <div id="edit-modal" class="modal">
        <div class="modal-content">
            <h3 id="modal-title">Редактирование</h3>
            <input type="hidden" id="edit-field">
            <input type="text" id="edit-input" class="modal-input" placeholder="Введите описание траты"
                style="display: none;">
            <select id="edit-select" class="modal-select" style="display: none;"></select>
            <input type="datetime-local" id="edit-date" class="modal-input" style="display: none;">
            <div class="modal-buttons">
                <button class="modal-btn save" id="save-edits">Сохранить</button>
                <button class="modal-btn cancel" id="cancel-edit">Отмена</button>
            </div>
        </div>
    </div>

    <!-- Подключение JavaScript -->
    <script src="js/config.js"></script>
    <script src="js/toast.js"></script>
    <script src="js/theme.js"></script>
    <script src="js/auth-check.js"></script>
    <script src="js/app.js"></script>
</body>

</html>
