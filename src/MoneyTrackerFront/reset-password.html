<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Новый пароль — MoneyTracker</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/auth.css">
</head>

<body>
    <div class="auth-wrapper">
        <div class="auth-card">
            <div class="auth-logo">💰</div>
            <h1 class="auth-title">MoneyTracker</h1>

            <!-- Форма -->
            <div id="state-form">
                <h2 class="auth-heading">Новый пароль</h2>
                <p class="auth-subtitle">Придумайте надёжный пароль минимум из 6 символов.</p>

                <div class="auth-form">
                    <div class="form-group">
                        <label class="form-label" for="new-password">Новый пароль</label>
                        <input type="password" id="new-password" class="form-input" placeholder="Минимум 6 символов"
                            autocomplete="new-password">
                    </div>
                    <div class="form-group">
                        <label class="form-label" for="confirm-password">Повторите пароль</label>
                        <input type="password" id="confirm-password" class="form-input" placeholder="Повторите пароль"
                            autocomplete="new-password">
                    </div>
                    <div id="form-error" class="auth-error hidden"></div>
                    <button class="auth-btn" id="submit-btn">Сохранить пароль</button>
                </div>
            </div>

            <!-- Недействительная ссылка -->
            <div id="state-invalid" class="hidden">
                <div class="auth-icon error">✕</div>
                <h2 class="auth-heading">Ссылка недействительна</h2>
                <p class="auth-subtitle">Ссылка устарела или уже была использована.</p>
                <a href="forgot-password.html" class="auth-btn">Запросить новую ссылку</a>
            </div>

            <!-- Успех -->
            <div id="state-success" class="hidden">
                <div class="auth-icon success">✓</div>
                <h2 class="auth-heading">Пароль изменён!</h2>
                <p class="auth-subtitle">Теперь вы можете войти с новым паролем.</p>
                <a href="login.html" class="auth-btn">Войти</a>
            </div>
        </div>
    </div>

    <script src="js/config.js"></script>
    <script src="js/theme.js"></script>
    <script>
        const params = new URLSearchParams(window.location.search);
        const token = params.get('token');

        if (!token) {
            document.getElementById('state-form').classList.add('hidden');
            document.getElementById('state-invalid').classList.remove('hidden');
        }

        const submitBtn = document.getElementById('submit-btn');
        const newPasswordInput = document.getElementById('new-password');
        const confirmPasswordInput = document.getElementById('confirm-password');
        const errorDiv = document.getElementById('form-error');

        function showError(msg) {
            errorDiv.textContent = msg;
            errorDiv.classList.remove('hidden');
        }

        function hideError() {
            errorDiv.classList.add('hidden');
        }

        submitBtn.addEventListener('click', async () => {
            const newPassword = newPasswordInput.value;
            const confirmPassword = confirmPasswordInput.value;
            hideError();

            if (!newPassword || newPassword.length < 6) {
                showError('Пароль должен содержать минимум 6 символов');
                return;
            }

            if (newPassword !== confirmPassword) {
                showError('Пароли не совпадают');
                return;
            }

            submitBtn.disabled = true;
            submitBtn.textContent = '...';

            try {
                const response = await fetch(`${API_BASE_URL}/auth/reset-password`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ token, newPassword }),
                });

                if (response.ok) {
                    document.getElementById('state-form').classList.add('hidden');
                    document.getElementById('state-success').classList.remove('hidden');
                } else {
                    const data = await response.json().catch(() => ({}));
                    if (response.status === 404 || response.status === 400) {
                        document.getElementById('state-form').classList.add('hidden');
                        document.getElementById('state-invalid').classList.remove('hidden');
                    } else {
                        showError(data.message || 'Ошибка при сбросе пароля');
                        submitBtn.disabled = false;
                        submitBtn.textContent = 'Сохранить пароль';
                    }
                }
            } catch {
                showError('Ошибка соединения с сервером');
                submitBtn.disabled = false;
                submitBtn.textContent = 'Сохранить пароль';
            }
        });

        confirmPasswordInput.addEventListener('keypress', e => {
            if (e.key === 'Enter') submitBtn.click();
        });
    </script>
</body>

</html>
