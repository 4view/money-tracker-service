<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Все траты - MoneyTracker</title>

    <!-- Подключение CSS -->
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/expenses.css">
</head>

<body>
    <div class="container">
        <!-- Шапка с навигацией -->
        <div class="header">
            <div class="nav-header">
                <a href="index.html" class="back-btn">Назад</a>
                <h1>Все траты</h1>
                <div class="user-info" id="user-info">
                    <span class="user-name" id="user-name"></span>
                </div>
            </div>
        </div>

        <!-- Фильтры -->
        <!-- Фильтры -->
        <div class="filters-container">
            <div class="filter-row">
                <div class="filter-group">
                    <label for="month-filter">Месяц</label>
                    <select id="month-filter" class="filter-select">
                        <option value="">Все месяцы</option>
                        <option value="1">Январь</option>
                        <option value="2">Февраль</option>
                        <option value="3">Март</option>
                        <option value="4">Апрель</option>
                        <option value="5">Май</option>
                        <option value="6">Июнь</option>
                        <option value="7">Июль</option>
                        <option value="8">Август</option>
                        <option value="9">Сентябрь</option>
                        <option value="10">Октябрь</option>
                        <option value="11">Ноябрь</option>
                        <option value="12">Декабрь</option>
                    </select>
                </div>

                <div class="filter-group">
                    <label for="category-filter">Категория</label>
                    <select id="category-filter" class="filter-select">
                        <option value="">Все категории</option>
                    </select>
                </div>
            </div>

            <div class="filter-row">
                <div class="filter-group">
                    <label for="year-filter">Год</label>
                    <select id="year-filter" class="filter-select">
                        <!-- Годы будут добавлены через JS -->
                    </select>
                </div>
            </div>

            <div class="filter-buttons">
                <button class="filter-btn" id="apply-filters">Применить</button>
                <button class="filter-btn reset" id="reset-filters">Сбросить</button>
            </div>
        </div>

        <!-- Статистика -->
        <div class="stats-container">
            <div class="stat-card">
                <span class="stat-label">Всего трат</span>
                <span class="stat-value" id="total-count">0</span>
            </div>
            <div class="stat-card">
                <span class="stat-label">Общая сумма</span>
                <span class="stat-value" id="total-sum">0 ₽</span>
            </div>
        </div>

        <!-- Экспорт -->
        <div class="export-row">
            <button class="export-btn" id="export-csv">⬇ Скачать CSV</button>
        </div>

        <!-- Список трат -->
        <div class="expenses-list" id="expenses-list">
            <div class="loading-spinner">Загрузка...</div>
        </div>

        <!-- Пагинация -->
        <div class="pagination">
            <button class="pagination-btn" id="prev-page" disabled>← Предыдущая</button>
            <span class="page-info" id="page-info">Страница 1 из 1</span>
            <button class="pagination-btn" id="next-page" disabled>Следующая →</button>
        </div>
    </div>

    <!-- Модальное окно для редактирования траты -->
    <div id="edit-expense-modal" class="modal">
        <div class="modal-content">
            <h3>Редактирование траты</h3>
            <input type="hidden" id="edit-expense-id">

            <div class="form-group">
                <label for="edit-expense-date">Дата и время</label>
                <input type="datetime-local" id="edit-expense-date" class="modal-input">
            </div>

            <div class="form-group">
                <label for="edit-expense-sum">Сумма (₽)</label>
                <input type="number" step="0.01" id="edit-expense-sum" class="modal-input" placeholder="0.00">
            </div>

            <div class="form-group">
                <label for="edit-expense-description">Описание</label>
                <input type="text" id="edit-expense-description" class="modal-input" placeholder="Описание траты">
            </div>

            <div class="form-group">
                <label for="edit-expense-category">Категория</label>
                <select id="edit-expense-category" class="modal-select"></select>
            </div>

            <div class="modal-buttons">
                <button class="modal-btn save" id="save-expense-edit">Сохранить</button>
                <button class="modal-btn cancel" id="cancel-expense-edit">Отмена</button>
            </div>
        </div>
    </div>

    <!-- Модальное окно подтверждения удаления -->
    <div id="delete-modal" class="modal">
        <div class="modal-content delete-modal">
            <h3>Подтверждение удаления</h3>
            <p>Вы уверены, что хотите удалить эту трату?</p>
            <div class="modal-buttons">
                <button class="modal-btn delete" id="confirm-delete">Удалить</button>
                <button class="modal-btn cancel" id="cancel-delete">Отмена</button>
            </div>
        </div>
    </div>

    <script src="js/toast.js"></script>
    <script src="js/theme.js"></script>
    <script src="js/auth-check.js"></script>
    <script src="js/expenses.js"></script>
</body>

</html>
